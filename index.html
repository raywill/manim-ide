<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manim Visual Editor</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Math.js for function plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
</head>
<body>
    <!-- 顶部工具栏 -->
    <div id="toolbar">
        <div class="toolbar-left">
            <h1>Manim Visual Editor</h1>
        </div>
        <div class="toolbar-center">
            <button id="undo-btn" title="撤销 (Ctrl+Z)">↶ 撤销</button>
            <button id="redo-btn" title="重做 (Ctrl+Y)">↷ 重做</button>
            <button id="delete-btn" title="删除 (Delete)">🗑️ 删除</button>
            <button id="clear-btn" title="清空所有图形">🗑️ 清空</button>
        </div>
        <div class="toolbar-right">
            <button id="import-json-btn">📥 导入JSON</button>
            <button id="export-json-btn">💾 导出JSON</button>
            <button id="export-btn" class="primary">📤 导出Manim代码</button>
        </div>
    </div>

    <!-- 主容器 -->
    <div id="main-container">
        <!-- 左侧工具箱 -->
        <div id="toolbox">
            <h3>形状工具</h3>
            <div id="shape-tools">
                <!-- 形状按钮将由JavaScript动态生成 -->
            </div>
        </div>

        <!-- 画布容器 -->
        <div id="canvas-container">
            <canvas id="main-canvas"></canvas>
            <!-- 辅助线 -->
            <div id="guide-lines">
                <div id="guide-vertical" class="guide-line"></div>
                <div id="guide-horizontal" class="guide-line"></div>
            </div>
            <!-- 坐标显示 -->
            <div id="coord-display"></div>
        </div>

        <!-- 右侧属性面板 -->
        <div id="property-panel" class="hidden">
            <div class="panel-header">
                <h3>属性</h3>
                <button id="close-panel-btn">✕</button>
            </div>
            <div id="property-content">
                <!-- 属性字段将由JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <!-- 导出代码模态框 -->
    <div id="export-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>导出的Manim代码</h2>
                <button id="close-modal-btn" class="close-btn">✕</button>
            </div>
            <div class="modal-body">
                <pre id="export-code-display"></pre>
            </div>
            <div class="modal-footer">
                <button id="copy-code-btn" class="primary">📋 复制代码</button>
                <button id="download-code-btn">💾 下载为.py文件</button>
            </div>
        </div>
    </div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="file-input" accept=".json" style="display: none;">

    <!-- JavaScript模块 -->
    <script src="js/core.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/export.js"></script>
    
    <!-- 插件辅助函数已并入 core.js 的 ManimEditor.utils -->
    
    <!-- 形状插件 -->
    <script src="js/plugins/square/square.js"></script>
    <script src="js/plugins/rectangle/rectangle.js"></script>
    <script src="js/plugins/triangle/triangle.js"></script>
    <script src="js/plugins/circle/circle.js"></script>
    <script src="js/plugins/ellipse/ellipse.js"></script>
    <script src="js/plugins/polygon/polygon.js"></script>
    <script src="js/plugins/arc/arc.js"></script>
    <script src="js/plugins/sector/sector.js"></script>
    <script src="js/plugins/angle/angle.js"></script>
    <script src="js/plugins/arrow/arrow.js"></script>
    <script src="js/plugins/line/line.js"></script>
    <script src="js/plugins/curve/curve.js"></script>
    <script src="js/plugins/sine/sine.js"></script>
    <script src="js/plugins/parabola/parabola.js"></script>
    <script src="js/plugins/coordinateSystem/coordinateSystem.js"></script>
    <script src="js/plugins/label/label.js"></script>
    <script src="js/plugins/function/function.js"></script>
    
    <!-- 主应用初始化 -->
    <script src="js/app.js"></script>
</body>
</html>
